<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full Portfolio — Print / Save PDF</title><link rel="stylesheet" href="assets/styles.css"><style>
.print-toolbar { position:sticky; top:0; z-index:8; background:#222; color:white; padding:13px 24px; display:flex; gap:20px; align-items:center; justify-content:center; }
.print-toolbar button { background:#f5c84b; border:0; font-weight:750; padding:9px 17px; cursor:pointer; }.print-toolbar p { color:white; margin:0; font-size:.85rem; }
.full-portfolio .print-section:not(:first-child) { border-top:3px solid #282828; margin-top:25px; padding-top:15px; }
@media print{ .print-toolbar { display:none!important; } .full-portfolio .print-section:not(:first-child) { border:0; break-before:page; margin:0; padding:0; } .full-portfolio .page-hero { margin-bottom:5px; } }
</style></head><body><div class="print-toolbar"><p>All portfolio pages in one document — update your content before submitting.</p><button type="button" onclick="window.print()">Print / Save as PDF</button></div><div id="full-portfolio" class="full-portfolio"><p style="text-align:center;padding:35px">Loading pages…</p></div><script>
const files=['index.html','about.html','cv.html','academic-journey.html','group-work.html','skills-projects.html','application-letter.html','email-template.html','study-resources.html'];
Promise.all(files.map(async f => {const r=await fetch(f);if(!r.ok)throw Error(f+': '+r.status);const t=await r.text();const d=new DOMParser().parseFromString(t,'text/html');return {title:d.title,main:d.querySelector('main').innerHTML};})).then(items=>{const root=document.getElementById('full-portfolio');root.textContent='';items.forEach(item=>{const s=document.createElement('section');s.className='print-section';s.innerHTML=item.main;root.appendChild(s);});}).catch(e=>{document.getElementById('full-portfolio').textContent='Could not load pages. Use GitHub Pages or a local web server to view this page. '+e.message;});
</script></body></html>
